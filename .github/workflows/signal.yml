# Wydanie serwera sygnalizacyjnego: jeden plik osada-signal.cjs i jego suma SHA-256.
# Serwer gry pobiera plik z wydania i odrzuca go, gdy suma nie zgadza sie z ta wpisana w jego konfiguracji,
# wiec CI tylko buduje i publikuje - niczego nie wdraza.

name: signal

on:
  push:
    tags:
      - 'signal-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/net/signal.test.ts
      - run: npm run build:server
      - name: Suma kontrolna
        working-directory: dist-server
        run: sha256sum osada-signal.cjs | tee osada-signal.cjs.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-server/osada-signal.cjs
            dist-server/osada-signal.cjs.sha256
