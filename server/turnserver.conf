# coturn dla Osadnikow Doliny - szablon; install.sh podstawia wartosci __...__.
# Dane logowania sa krotkotrwale: serwer sygnalizacyjny wydaje je z tego samego sekretu (use-auth-secret).

listening-port=__PORT__
# Oracle Cloud: maszyna ma adres prywatny za NAT - podajemy publiczny/prywatny.
external-ip=__EXTERNAL_IP__
min-port=__MIN_PORT__
max-port=__MAX_PORT__

use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=__REALM__

fingerprint
no-cli
no-tls
no-dtls
# Bez przekazywania do sieci prywatnych i petli zwrotnej (ochrona przed naduzyciem serwera).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Limity (gra potrzebuje malej przepustowosci).
total-quota=100
user-quota=12
max-bps=500000
stale-nonce=600
log-file=syslog
simple-log
